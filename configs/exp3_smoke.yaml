# EXP-3 smoke — 2 multipliers, 1 seed, tiny pop. ~3 min.
model: qwen3.5:2b
seed: 7
ollama_url: http://127.0.0.1:11434

models: [qwen3.5:2b]
seeds: [7]
influence_multipliers: [1, 10]
influence_num_baseline: 5
influence_pushed_opinion: "strongly support"
influence_inner_condition: likes

num_agents: 5
num_rounds: 3
topic: "Should AI-generated content be labeled on social platforms?"

conditions: [likes]
use_peer_voting: true
voting_k_per_voter: 3
embed_model: nomic-embed-text

temperature: 0.8
max_tokens: 220
request_timeout: 180
post_char_limit: 240
likes_visibility_top_k: 4
output_dir: runs
