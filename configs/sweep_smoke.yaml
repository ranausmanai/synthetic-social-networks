# Tiny multi-model sweep to smoke-test the sweep pipeline end-to-end.
model: qwen3.5:2b
seed: 42

models:
  - qwen3.5:2b
  - llama3.2:3b

seeds:
  - 7
  - 1337

ollama_url: http://localhost:11434
num_agents: 3
num_rounds: 2
topic: "Should AI-generated content be labeled on social platforms?"

conditions:
  - control
  - likes

temperature: 0.8
max_tokens: 220
request_timeout: 120
post_char_limit: 240
likes_visibility_top_k: 3
downvote_threshold: 0.3
output_dir: runs
