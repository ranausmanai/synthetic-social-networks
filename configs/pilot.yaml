# Pilot validation: 1 model × 1 seed × 5 conditions × 10 agents × 10 rounds
# + peer voting + embedding metrics. Should take ~30 min on RTX 4000 Ada.

model: qwen3.5:2b
seed: 42
ollama_url: http://127.0.0.1:11434

num_agents: 10
num_rounds: 10
topic: "Should AI-generated content be labeled on social platforms?"

conditions:
  - control
  - likes
  - majority
  - leaderboard
  - downvote

# === Methodological-credibility upgrades ===
use_peer_voting: true
voting_k_per_voter: 5
embed_model: nomic-embed-text

temperature: 0.8
max_tokens: 220
request_timeout: 180
post_char_limit: 280
likes_visibility_top_k: 5
downvote_threshold: 0.3
output_dir: runs
